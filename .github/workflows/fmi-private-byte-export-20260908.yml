name: FMI Private Byte Export 20260908

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fmi-private-byte-export-20260908.yml'

permissions:
  contents: read

jobs:
  qwen-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLAMA_TAG: b10837
      LLAMA_SHA256: d0514baaa6e1711eb02cbe2cfa9ca4fee7d8dc6ab50a0f6046eaf91d8a444b7f
      MODEL_REPO: Qwen/Qwen3-4B-GGUF
      MODEL_REVISION: bc640142c66e1fdd12af0bd68f40445458f3869b
      MODEL_FILE: Qwen3-4B-Q4_K_M.gguf
      MODEL_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
    steps:
      - name: Fetch verify and split pinned Qwen bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz" -o llama.tar.gz
          echo "${LLAMA_SHA256}  llama.tar.gz" | sha256sum -c -
          curl -fL --retry 3 --retry-delay 2 "https://huggingface.co/${MODEL_REPO}/resolve/${MODEL_REVISION}/${MODEL_FILE}?download=true" -o "${MODEL_FILE}"
          echo "${MODEL_SHA256}  ${MODEL_FILE}" | sha256sum -c -
          sha256sum llama.tar.gz "${MODEL_FILE}" > WHOLE_SHA256.txt
          split -b 400M -d -a 2 "${MODEL_FILE}" qwen.part.
          test "$(find . -maxdepth 1 -name 'qwen.part.*' | wc -l)" -eq 6
          sha256sum qwen.part.* > PART_SHA256.txt
      - name: Upload pinned llama runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fmi-runtime-b10837-20260908
          path: |
            llama.tar.gz
            WHOLE_SHA256.txt
          compression-level: 0
          retention-days: 1
      - name: Upload Qwen part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-qwen-part-00-20260908, path: qwen.part.00, compression-level: 0, retention-days: 1}
      - name: Upload Qwen part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-qwen-part-01-20260908, path: qwen.part.01, compression-level: 0, retention-days: 1}
      - name: Upload Qwen part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-qwen-part-02-20260908, path: qwen.part.02, compression-level: 0, retention-days: 1}
      - name: Upload Qwen part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-qwen-part-03-20260908, path: qwen.part.03, compression-level: 0, retention-days: 1}
      - name: Upload Qwen part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-qwen-part-04-20260908, path: qwen.part.04, compression-level: 0, retention-days: 1}
      - name: Upload Qwen part 05 plus hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fmi-qwen-part-05-20260908
          path: |
            qwen.part.05
            PART_SHA256.txt
            WHOLE_SHA256.txt
          compression-level: 0
          retention-days: 1

  phi-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_REPO: microsoft/Phi-3-mini-4k-instruct-gguf
      MODEL_REVISION: 8842f87a812f23f981be51e31fbbfbc34e72c16d
      MODEL_FILE: Phi-3-mini-4k-instruct-q4.gguf
      MODEL_SHA256: 8a83c7fb9049a9b2e92266fa7ad04933bb53aa1e85136b7b30f1b8000ff2edef
    steps:
      - name: Fetch verify and split pinned Phi bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "https://huggingface.co/${MODEL_REPO}/resolve/${MODEL_REVISION}/${MODEL_FILE}?download=true" -o "${MODEL_FILE}"
          echo "${MODEL_SHA256}  ${MODEL_FILE}" | sha256sum -c -
          sha256sum "${MODEL_FILE}" > WHOLE_SHA256.txt
          split -b 400M -d -a 2 "${MODEL_FILE}" phi.part.
          test "$(find . -maxdepth 1 -name 'phi.part.*' | wc -l)" -eq 6
          sha256sum phi.part.* > PART_SHA256.txt
      - name: Upload Phi part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-phi-part-00-20260908, path: phi.part.00, compression-level: 0, retention-days: 1}
      - name: Upload Phi part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-phi-part-01-20260908, path: phi.part.01, compression-level: 0, retention-days: 1}
      - name: Upload Phi part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-phi-part-02-20260908, path: phi.part.02, compression-level: 0, retention-days: 1}
      - name: Upload Phi part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-phi-part-03-20260908, path: phi.part.03, compression-level: 0, retention-days: 1}
      - name: Upload Phi part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fmi-phi-part-04-20260908, path: phi.part.04, compression-level: 0, retention-days: 1}
      - name: Upload Phi part 05 plus hashes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fmi-phi-part-05-20260908
          path: |
            phi.part.05
            PART_SHA256.txt
            WHOLE_SHA256.txt
          compression-level: 0
          retention-days: 1
