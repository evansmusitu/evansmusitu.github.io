name: MUSITU Corporate PR33 Exact-Source Qualification

on:
  push:
    branches: [ops/qualify-pr33-20261106]

permissions:
  contents: read

concurrency:
  group: musitu-corporate-pr33-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout the immutable PR 33 candidate
        uses: actions/checkout@v4
        with:
          ref: 87cc21fc482ca1a200c3c37a6f527c7d63e3ca34
          persist-credentials: false
      - name: Confirm exact source revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "87cc21fc482ca1a200c3c37a6f527c7d63e3ca34"
          git diff --exit-code HEAD -- corporate/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tests and browser engines
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest beautifulsoup4 playwright
          python -m playwright install --with-deps chromium firefox webkit
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser_path=p.chromium.executable_path
          assert os.path.isfile(browser_path),browser_path
          os.system("sudo ln -sf "+browser_path+" /usr/bin/chromium")
          assert os.path.exists('/usr/bin/chromium')
          PY
      - name: Download and hash-pin already-published Studio media
        working-directory: corporate
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 3             https://mftintelligence.com/assets/studio-demo-82s.mp4             --output assets/studio-demo-82s.mp4
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 3             https://mftintelligence.com/assets/studio-poster.png             --output assets/studio-poster.png
          printf '%s  %s\n'             'afd6dfd3c73668e544f3f8a857697fed0abaadccd4927202bb3a185612c2dea0' 'assets/studio-demo-82s.mp4'             '0ea5e961d916375029010dbae01bf8a1783e5fd6b90f74c006dc852df1c285d0' 'assets/studio-poster.png' | sha256sum --check
      - name: Review-mode tests, DOM and portable browser qualification
        working-directory: corporate
        env:
          MUSITU_PROTECTED_STAGING_MEDIA: '1'
        run: |
          set -euo pipefail
          python scripts/build.py
          python -m pytest -q tests/test_site.py tests/test_http.py tests/test_sitemap.py tests/test_studio_and_store.py
          node --check assets/site.js
          node --check dist/assets/site-data.js
          python tests/browser_review.py
          python scripts/make_portable_preview.py
          python tests/browser_portable.py
      - name: Production-mode exact SHA deterministic build
        working-directory: corporate
        env:
          MUSITU_BUILD_MODE: production
          MUSITU_CANONICAL_ORIGIN: https://mftintelligence.com
          MUSITU_INCLUDE_STUDIO_MEDIA: '1'
        run: |
          set -euo pipefail
          python scripts/build.py
          python -m pytest -q tests/test_production_build.py
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pr33-production-first.txt
          sha256sum dist/manifest.json
          python scripts/build.py
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pr33-production-second.txt
          diff -u /tmp/pr33-production-first.txt /tmp/pr33-production-second.txt
          python -m pytest -q tests/test_production_build.py
          echo 'PR33 deterministic production candidate generated twice with identical hashes'
      - name: Cross-browser real HTTP reflow and runtime checks
        working-directory: corporate
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/pr33-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          from playwright.sync_api import sync_playwright
          routes=json.load(open('dist/manifest.json'))['routes']
          for _ in range(30):
            try:
              with urllib.request.urlopen('http://127.0.0.1:8765/') as r:
                assert r.status==200
              break
            except Exception: time.sleep(1)
          else:raise RuntimeError('Local production server failed')
          results={}
          with sync_playwright() as pw:
            for engine_name in ('chromium','firefox','webkit'):
              browser=getattr(pw,engine_name).launch(headless=True)
              count=0
              for route in routes:
                page=browser.new_page(viewport={'width':1280,'height':800})
                errors=[]
                page.on('pageerror', lambda e, store=errors:store.append(str(e)))
                resp=page.goto('http://127.0.0.1:8765'+route,wait_until='domcontentloaded',timeout=20000)
                assert resp and resp.status==200,(engine_name,route,resp.status if resp else None)
                assert page.locator('main#main').count()==1,(engine_name,route)
                assert page.locator('h1').count()==1,(engine_name,route)
                for width in (320,390,1280):
                  page.set_viewport_size({'width':width,'height':800})
                  page.wait_for_timeout(35)
                  measure=page.evaluate('() => [document.documentElement.scrollWidth, document.documentElement.clientWidth]')
                  assert measure[0] <= measure[1]+3,(engine_name,route,width,measure)
                  count+=1
                assert not errors,(engine_name,route,errors)
                page.close()
              browser.close()
              results[engine_name]=count
          print('HTTP BROWSER ACCEPTANCE:',json.dumps({'routes':len(routes),'viewport_checks':results,'errors':0}))
          PY
      - name: Safety boundary
        run: |
          echo 'QUALIFICATION ONLY: no deploy, DNS mutation, merge, secret access, or Pages project change.'
