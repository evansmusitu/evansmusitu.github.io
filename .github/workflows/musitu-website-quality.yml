name: MUSITU Website Quality

on:
  pull_request:
    paths:
      - index.html
      - tests/site.test.mjs
      - .github/workflows/musitu-website-quality.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/site.test.mjs
      - .github/workflows/musitu-website-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate MUSITU website
        run: node tests/site.test.mjs
