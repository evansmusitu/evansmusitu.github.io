name: MUSITU Website Quality

on:
  pull_request:
    paths:
      - index.html
      - tests/site.test.mjs
      - tests/workspace-vault.test.mjs
      - tests/workspace-slots.test.mjs
      - tests/local-evidence.test.mjs
      - tests/evidence-pack.test.mjs
      - assets/musitu-evidence-pack.mjs
      - assets/musitu-local-evidence.mjs
      - assets/musitu-workspace-slots.mjs
      - assets/musitu-workspace-vault.mjs
      - assets/musitu-workspace-ui.mjs
      - assets/musitu-document-extract.mjs
      - package.json
      - .github/workflows/musitu-website-quality.yml
  push:
    branches: [main]
    paths:
      - index.html
      - tests/site.test.mjs
      - .github/workflows/musitu-website-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate MUSITU website
        run: |
          set -euo pipefail
          node --check assets/musitu-workspace-vault.mjs
          node --check assets/musitu-workspace-ui.mjs
          node --check assets/musitu-workspace-slots.mjs
          node --check assets/musitu-local-evidence.mjs
          node --test tests/workspace-vault.test.mjs tests/workspace-slots.test.mjs tests/evidence-pack.test.mjs tests/local-evidence.test.mjs
          node tests/site.test.mjs
