name: MUSITU Cloudflare AI Site Verification

on:
  pull_request:
    paths:
      - index.html
      - assets/musitu-edge-chat.js
      - assets/musitu-local-evidence.mjs
      - assets/musitu-evidence-pack.mjs
      - assets/musitu-source-integrity.mjs
      - tests/source-integrity.test.mjs
      - tests/evidence-pack.test.mjs
      - assets/musitu-workspace-vault.mjs
      - assets/musitu-workspace-ui.mjs
      - assets/musitu-workspace-slots.mjs
      - tests/workspace-slots.test.mjs
      - assets/musitu-edge-chat.css
      - assets/musitu-document-extract.mjs
      - package.json
      - scripts/prepare-document-vendors.sh
      - tests/edge-chat-e2e.mjs
      - tests/workspace-vault.test.mjs
      - .github/workflows/musitu-cloudflare-edge-ui.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/musitu-edge-chat.js
      - assets/musitu-edge-chat.css
      - tests/edge-chat-e2e.mjs
      - .github/workflows/musitu-cloudflare-edge-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --ignore-scripts --no-fund --no-audit --package-lock=false
          bash scripts/prepare-document-vendors.sh
          npx playwright install chromium --with-deps
      - name: Verify native homepage AI with live Cloudflare Workers inference
        run: node tests/edge-chat-e2e.mjs
