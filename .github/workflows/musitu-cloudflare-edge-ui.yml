name: MUSITU Cloudflare AI Site Verification

on:
  pull_request:
    paths:
      - index.html
      - assets/musitu-edge-chat.js
      - assets/musitu-edge-chat.css
      - tests/edge-chat-e2e.mjs
      - .github/workflows/musitu-cloudflare-edge-ui.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/musitu-edge-chat.js
      - assets/musitu-edge-chat.css
      - tests/edge-chat-e2e.mjs
      - .github/workflows/musitu-cloudflare-edge-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install chromium --with-deps
      - name: Verify native homepage AI with live Cloudflare Workers inference
        run: node tests/edge-chat-e2e.mjs
