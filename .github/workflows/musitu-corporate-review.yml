name: MUSITU Corporate Site Review
on:
  pull_request:
    paths:
      - 'corporate/**'
      - '.github/workflows/musitu-corporate-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corporate-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Static and offline browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 beautifulsoup4==4.14.2 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Build review pages (no deployment)
        working-directory: corporate
        run: python scripts/build.py
      - name: Check routes, links, claim boundaries, staging gates and build manifest
        working-directory: corporate
        run: python -m pytest -q tests/test_site.py
      - name: Check JavaScript syntax
        run: node --check corporate/assets/site.js
      - name: Real Chromium interactions in offline DOM
        working-directory: corporate
        run: python tests/browser_smoke.py
      - name: Extended keyboard, reduced-motion and responsive matrix (198 views)
        working-directory: corporate
        run: python tests/browser_extended.py
      - name: Confirm noindex and no production writes
        run: |
          test -s corporate/dist/index.html
          grep -q 'noindex,nofollow' corporate/dist/index.html
          test "$(find corporate/dist -name index.html | wc -l)" -eq 22
          test ! -e corporate/dist/.env
      - name: Upload review-only website and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musitu-corporate-noindex-review
          path: |
            corporate/dist/
            corporate/review-artifacts/*.png
            corporate/review-artifacts/extended-browser-results.json
          if-no-files-found: warn
          retention-days: 7
