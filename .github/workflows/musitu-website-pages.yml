name: MUSITU Website Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'assets/**'
      - package.json
      - scripts/prepare-document-vendors.sh
      - .github/workflows/musitu-website-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: musitu-website-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local document parsers
        run: |
          npm install --omit=dev --ignore-scripts --no-fund --no-audit --package-lock=false
          bash scripts/prepare-document-vendors.sh
      - name: Prepare static website
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/musitu-edge-chat.js _site/assets/musitu-edge-chat.js
          cp assets/musitu-edge-chat.css _site/assets/musitu-edge-chat.css
          cp assets/musitu-workspace-vault.mjs _site/assets/musitu-workspace-vault.mjs
          cp assets/musitu-workspace-ui.mjs _site/assets/musitu-workspace-ui.mjs
          cp assets/musitu-workspace-slots.mjs _site/assets/musitu-workspace-slots.mjs
          test -s _site/assets/musitu-workspace-slots.mjs
          test -s _site/assets/musitu-workspace-vault.mjs
          test -s _site/assets/musitu-workspace-ui.mjs
          mkdir -p _site/assets/vendor
          cp assets/musitu-document-extract.mjs _site/assets/musitu-document-extract.mjs
          cp assets/musitu-local-evidence.mjs _site/assets/musitu-local-evidence.mjs
          cp assets/musitu-evidence-pack.mjs _site/assets/musitu-evidence-pack.mjs
          cp assets/musitu-source-integrity.mjs _site/assets/musitu-source-integrity.mjs
          test -s _site/assets/musitu-evidence-pack.mjs
          test -s _site/assets/musitu-source-integrity.mjs
          test -s _site/assets/musitu-local-evidence.mjs
          cp assets/vendor/pdf.mjs _site/assets/vendor/pdf.mjs
          cp assets/vendor/pdf.worker.mjs _site/assets/vendor/pdf.worker.mjs
          cp assets/vendor/mammoth.browser.min.js _site/assets/vendor/mammoth.browser.min.js
          test -s _site/assets/musitu-document-extract.mjs
          test -s _site/assets/vendor/pdf.mjs
          test -s _site/assets/vendor/pdf.worker.mjs
          test -s _site/assets/vendor/mammoth.browser.min.js
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/musitu-edge-chat.js
          test -s _site/assets/musitu-edge-chat.css
          echo 'MUSITU site and all AI client assets packaged'
      - uses: actions/configure-pages@v5
      # A failed deployment rerun retains its previous artifact in the same
      # workflow run. Use a unique artifact name per run attempt to avoid
      # "Multiple artifacts named github-pages" and keep retries recoverable.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: musitu-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: musitu-pages-${{ github.run_id }}-${{ github.run_attempt }}
