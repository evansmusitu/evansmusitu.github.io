name: MUSITU Website Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - 'assets/**'
      - .github/workflows/musitu-website-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: musitu-website-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp assets/musitu-edge-chat.js _site/assets/musitu-edge-chat.js
          cp assets/musitu-edge-chat.css _site/assets/musitu-edge-chat.css
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/musitu-edge-chat.js
          test -s _site/assets/musitu-edge-chat.css
          echo 'MUSITU site and all AI client assets packaged'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
