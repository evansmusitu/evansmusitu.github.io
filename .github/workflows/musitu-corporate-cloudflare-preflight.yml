name: MUSITU Corporate Cloudflare Read-only Credential Preflight

on:
  push:
    branches: [ops/cloudflare-preflight-pr33-20261106]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify available Cloudflare secret key names (never print values)
        env:
          SECRET_INVENTORY_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import os,json
          keys=list(json.loads(os.environ.get('SECRET_INVENTORY_JSON','{}')).keys())
          cf=[k for k in keys if any(term in k.upper() for term in ('CLOUDFLARE','CF_','WRANGLER','PAGES','MUSITU'))]
          print('Available scoped Cloudflare-related Actions secret NAMES:', json.dumps(cf))
          print('Total visible Actions secret key names:',len(keys))
          print('Secret VALUES are not printed, persisted or transmitted.')
          PY
      - name: Inspect only Cloudflare Pages token capability
        env:
          CF_TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_B: ${{ secrets.CF_API_TOKEN }}
          CF_TOKEN_C: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CF_TOKEN_D: ${{ secrets.MUSITU_CF_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          tok=next((os.environ.get(s,'') for s in ('CF_TOKEN_A','CF_TOKEN_B','CF_TOKEN_C','CF_TOKEN_D') if os.environ.get(s,'')),None)
          print('Cloudflare credential configured in repository Actions:', bool(tok))
          if not tok:raise SystemExit(0)
          def call(path):
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/'+path,
                 headers={'Authorization':'Bearer '+tok,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=12) as response:return json.loads(response.read())
              except urllib.error.HTTPError as e:
                  print('Cloudflare API status:',e.code)
                  return {'success':False,'result':None}
          verify=call('user/tokens/verify')
          active=verify.get('success') is True and (verify.get('result') or {}).get('status')=='active'
          print('Cloudflare token active:',active)
          if not active:raise SystemExit(0)
          zones=call('zones?name=mftintelligence.com&per_page=3')
          zs=zones.get('result') or []
          found=next((z for z in zs if z.get('name')=='mftintelligence.com'),None)
          print('Corporate DNS zone accessible:',bool(found))
          if not found:raise SystemExit(0)
          acc=(found.get('account') or {}).get('id')
          if not acc:raise SystemExit(0)
          pr=call('accounts/'+urllib.parse.quote(acc,safe='')+'/pages/projects/musitu-corporate')
          proj=pr.get('result') or {}
          print('Exact corporate Pages project accessible:',pr.get('success') is True and proj.get('name')=='musitu-corporate')
          print('Production branch configured:',bool(proj.get('production_branch')))
          print('Project domain count:',len(proj.get('domains') or []))
          print('Preflight is read only; no Cloudflare/DNS actions performed.')
          PY
