name: MUSITU Corporate Soft-404 Maintenance Source Qualification

on:
  push:
    branches:
      - hotfix/corporate-soft404-20261109
    paths:
      - corporate/scripts/build.py
      - corporate/tests/test_site.py
      - .github/workflows/musitu-corporate-soft404-maintenance.yml

permissions:
  contents: read

jobs:
  review-mode-exact-build:
    if: ${{ github.repository == 'evansmusitu/evansmusitu.github.io' && github.ref == 'refs/heads/hotfix/corporate-soft404-20261109' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing offline test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Restore only checksum-approved public Studio media for complete existing test suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 https://mftintelligence.com/assets/studio-demo-82s.mp4 --output corporate/assets/studio-demo-82s.mp4
          curl --fail --silent --show-error --location --retry 2 https://mftintelligence.com/assets/studio-poster.png --output corporate/assets/studio-poster.png
          printf '%s  %s\n' 'afd6dfd3c73668e544f3f8a857697fed0abaadccd4927202bb3a185612c2dea0' 'corporate/assets/studio-demo-82s.mp4' | sha256sum --check
          printf '%s  %s\n' '0ea5e961d916375029010dbae01bf8a1783e5fd6b90f74c006dc852df1c285d0' 'corporate/assets/studio-poster.png' | sha256sum --check
      - name: Build the default nonpublic review artifact with approved private review media
        run: |
          MUSITU_BUILD_MODE=review MUSITU_PROTECTED_STAGING_MEDIA=1 python3 corporate/scripts/build.py
          python3 -c 'import json; from pathlib import Path; m=json.loads(Path("corporate/dist/manifest.json").read_text()); assert m["build_mode"]=="review" and m["route_count"]==34 and m["indexing_enabled"] is False'
      - name: Verify root 404 bytes and unaffected 34 route review site
        run: |
          python3 -m pytest -q corporate/tests/test_site.py
      - name: Verify no actual deploy and only existing local assets
        run: |
          test -f corporate/dist/404/index.html
          test -f corporate/dist/404.html
          test -f corporate/dist/robots.txt
          test ! -f corporate/dist/sitemap.xml
          test "$(find corporate/dist -name index.html | wc -l)" -eq 34
          node --check corporate/assets/site.js
      - name: Build and qualify exact production-mode 34/33 cohort with unchanged approved media (NO DEPLOY)
        run: |
          MUSITU_BUILD_MODE=production MUSITU_CANONICAL_ORIGIN=https://mftintelligence.com MUSITU_INCLUDE_STUDIO_MEDIA=1 python3 corporate/scripts/build.py
          python3 -m pytest -q corporate/tests/test_production_build.py
          test -f corporate/dist/404.html
          cmp corporate/dist/404.html corporate/dist/404/index.html
          test "$(find corporate/dist -name index.html | wc -l)" -eq 34
          node --check corporate/dist/assets/site-data.js
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          d=Path("corporate/dist")
          obj=json.loads((d/"manifest.json").read_text())
          assert obj["route_count"]==34 and obj["build_mode"]=="production"
          assert obj["indexing_enabled"] is True and obj["production_approved"] is False
          names=[x.text for x in ET.parse(d/"sitemap.xml").findall("{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc")]
          assert len(names)==33 and "https://mftintelligence.com/" in names
          assert not any("/fr/" in u or "/research/articles/" in u for u in names)
          assert "noindex,nofollow" in (d/"404.html").read_text()
          print("Production 34 routes / 33 existing URLs and root HTTP 404 asset: PASS; NOT DEPLOYED")
          PY
