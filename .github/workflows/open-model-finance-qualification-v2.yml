  finance-quorum-v2:
    needs: [qwen8b-finance, ministral3b-finance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Qwen3-8B evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen8b-finance-qualification
          path: qwen

      - name: Download Ministral evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ministral3b-finance-qualification
          path: ministral

      - name: Verify 8-case cross-family finance quorum
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          q=json.loads(pathlib.Path('qwen/qwen8b-finance-result.json').read_text())
          m=json.loads(pathlib.Path('ministral/ministral3b-finance-result.json').read_text())
          for x in (q,m):
              assert x['suite']=='PUBLIC_SAFE_FINANCE_RISK_8'
              assert x['verified'] is True and x['cases_passed']==x['cases_total']==8
              assert x['github_run_id']==int(os.environ['RUN_ID'])
              assert x['provider_api_used'] is False and x['provider_spend_usd']==0.0
              assert x['foundation_training'] is False and x['weights_modified'] is False
              assert x['production_authority'] is False and x['live_trading_authorized'] is False
          assert q['family']=='qwen3' and m['family']=='ministral3' and q['family']!=m['family']
          evidence={
            'schema':'open-model.github-public-runner-finance-council-evidence.v2',
            'result':'PUBLIC_SAFE_FINANCE_8_CASE_DUAL_FAMILY_VERIFIED',
            'execution_surface':'GITHUB_ACTIONS_PUBLIC_LOCAL_CPU',
            'github_run_id':int(os.environ['RUN_ID']),'source_sha':os.environ['SOURCE_SHA'],
            'suite':'PUBLIC_SAFE_FINANCE_RISK_8','cases_total':8,'cross_family_quorum':2,
            'independent_model_families':['qwen3','ministral3'],'members':[q,m],
            'provider_api_used':False,'provider_spend_usd':0.0,'foundation_training':False,'weights_modified':False,
            'production_authority':False,'live_trading_authorized':False,'frontier_superiority_certified':False
          }
          raw=(json.dumps(evidence,sort_keys=True,indent=2)+'\n').encode()
          pathlib.Path('OPEN_MODEL_FINANCE_COUNCIL_V2_EVIDENCE.json').write_bytes(raw)
          pathlib.Path('OPEN_MODEL_FINANCE_COUNCIL_V2_EVIDENCE.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  OPEN_MODEL_FINANCE_COUNCIL_V2_EVIDENCE.json\n')
          print(json.dumps(evidence,sort_keys=True,indent=2))
          print('EVIDENCE_SHA256='+hashlib.sha256(raw).hexdigest())
          PY

      - name: Upload finance council V2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: open-model-finance-council-v2-evidence
          path: |
            OPEN_MODEL_FINANCE_COUNCIL_V2_EVIDENCE.json
            OPEN_MODEL_FINANCE_COUNCIL_V2_EVIDENCE.sha256
          retention-days: 30
